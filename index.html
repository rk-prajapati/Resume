<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ramesh Kumar Prajapati — Resume</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #f3f4f6;
      text-align: center;
    }
    .toolbar {
      position: sticky;
      top: 0;
      z-index: 10;
      padding: 12px;
      background: rgba(255,255,255,.96);
      box-shadow: 0 1px 8px rgba(0,0,0,.12);
    }
    .download {
      display: inline-block;
      padding: 9px 16px;
      border-radius: 6px;
      background: #173f6b;
      color: white;
      text-decoration: none;
      font: 600 14px Arial, sans-serif;
    }
    .resume {
      display: block;
      width: min(100%, 595px);
      height: auto;
      margin: 18px auto 30px;
      background: white;
      box-shadow: 0 2px 16px rgba(0,0,0,.18);
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <a class="download" href="Ramesh_Kumar_Prajapati.pdf" download>
      Download Resume PDF
    </a>
  </div>

  <img
    class="resume"
    src="resume-page.png"
    alt="Ramesh Kumar Prajapati Resume"
  >
</body>
</html>
